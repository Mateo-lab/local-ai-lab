# Alerts: watches the services and the machine, and sends a notification when something goes wrong.
#
#   blackbox-exporter   checks over HTTP that each service answers (probes read by Prometheus)
#   alertmanager        groups Prometheus's alerts (rules: ../monitoring/prometheus/rules/)
#   alertmanager-ntfy   bridge: turns the alerts into ntfy notifications
#   ntfy                notification server (web page + phone app)
#
# Every port is bound to 127.0.0.1. Prerequisite: ai-stack AND monitoring started (shared networks): `lab start`.
# After the first start, restart Prometheus so that it reads the rules: `lab start monitoring` (recreates if needed)
# or `docker restart prometheus`.

name: alerting

services:
  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    command: serve
    environment:
      TZ: Europe/Brussels
      # Public address seen by your devices. Locally: http://127.0.0.1:2586 (see docs/alerts.md for the phone)
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://127.0.0.1:2586}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      # read-write = open to whoever reaches the port; harmless as long as the port is bound to 127.0.0.1.
      # If you expose it on the network/VPN: set deny-all (see docs/alerts.md).
      NTFY_AUTH_DEFAULT_ACCESS: ${NTFY_AUTH_DEFAULT_ACCESS:-read-write}
    volumes:
      - ntfy_data:/var/lib/ntfy
    ports:
      - "${NTFY_BIND:-127.0.0.1}:2586:80"
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  alertmanager-ntfy:
    # Community bridge (github.com/alexbakker/alertmanager-ntfy). Verified on the reference machine; see docs/alerts.md
    # if the container does not start (image name, command).
    image: ghcr.io/alexbakker/alertmanager-ntfy:latest
    container_name: alertmanager-ntfy
    restart: unless-stopped
    command: ["--configs", "/etc/alertmanager-ntfy/config.yml"]
    volumes:
      - ./alertmanager-ntfy/config.yml:/etc/alertmanager-ntfy/config.yml:ro
    depends_on:
      - ntfy
    logging: *logs

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - alertmanager-ntfy
    networks:
      - default
      - mon-net   # Prometheus reaches it there
    logging: *logs

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: blackbox-exporter
    restart: unless-stopped
    command:
      - --config.file=/config/blackbox.yml
    volumes:
      - ./blackbox/blackbox.yml:/config/blackbox.yml:ro
    networks:
      - mon-net   # Prometheus queries it here
      - ai-net    # to reach Open WebUI, n8n, Qdrant, Ollama, SearXNG
    logging: *logs

volumes:
  ntfy_data:
  alertmanager_data:

networks:
  default:
  ai-net:
    external: true
    name: ai-stack_ai-net
  mon-net:
    external: true
    name: mon-net
