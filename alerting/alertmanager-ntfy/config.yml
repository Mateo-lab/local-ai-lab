# Alertmanager -> ntfy bridge (github.com/alexbakker/alertmanager-ntfy).
# The keys come from its config.example.yml. A configuration that is too short (only `topic`) crashes the bridge
# (nil pointer in forwardAlert): priority, tags and templates must be defined.
http:
  addr: ":8000"

ntfy:
  # ntfy server as reached from the Docker network (not the address seen by your browser).
  baseurl: http://ntfy:80
  notification:
    # Topic name kept as is so that existing subscriptions keep working.
    topic: aibeast-alertes
    # Expression: urgent while the problem lasts, normal when it is resolved.
    priority: 'status == "firing" ? "urgent" : "default"'
    tags:
      - tag: rotating_light
        condition: 'status == "firing"'
      - tag: white_check_mark
        condition: 'status == "resolved"'
    templates:
      title: '{{ if eq .Status "resolved" }}Resolved: {{ end }}{{ index .Annotations "summary" }}'
      description: '{{ index .Annotations "description" }}'
