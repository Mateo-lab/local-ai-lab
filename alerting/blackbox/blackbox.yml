# "http_up" module: the service answers over HTTP (a 401/403 counts: it is alive, it just asks for credentials).
modules:
  http_up:
    prober: http
    timeout: 8s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4
      valid_status_codes: [200, 204, 301, 302, 303, 307, 308, 401, 403]
