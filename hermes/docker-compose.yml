# Hermes Agent (Nous Research): agent with sub-agents, memory and skills.
# Official image: nousresearch/hermes-agent (tags: stable, latest, main, X.Y.Z).
#
# Isolation: hermes-net network (internal) shared with Ollama only (no n8n, Qdrant or OpenClaw);
# no access to the Internet or the local network, except SSH to the allowed test machines (docs/agent-isolation.md).
# No published port, and NO Docker socket mounted: the agent works INSIDE this container,
# which is its sandbox. It only sees ./data (its memory AND its working folder ./data/workspace,
# seen as /opt/data/workspace in the container: put your files there).

name: hermes

services:
  hermes:
    image: nousresearch/hermes-agent:${HERMES_TAG:-stable}
    container_name: hermes
    # Used on demand (see ../5-hermes.sh); not a permanent service.
    restart: "no"
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
    volumes:
      - ./data:/opt/data
    # For the agent's browser tools (if used)
    shm_size: 1g
    mem_limit: 8g
    networks:
      - hermes-net
      - obs-net # to send traces to Langfuse (see ../langfuse), optional
      - hermes-sortie # ONLY exit: filtered by scripts/isolation-agents.sh (SSH to the machines in lab.conf, nothing else)

networks:
  hermes-net:
    external: true
    name: hermes-net
  obs-net:
    external: true
    name: obs-net
  # hermes-net and obs-net are internal (no exit). This network is Hermes's only route to the outside
  # ("sortie" = exit; name kept for existing installations); its interface name is fixed so that the firewall
  # (lab isolation) recognises it: everything is blocked there except SSH to LAB_AGENT_SSH_ALLOW (lab.conf).
  # See docs/agent-isolation.md.
  hermes-sortie:
    name: hermes-sortie
    driver_opts:
      com.docker.network.bridge.name: br-hermes-out
