# Quality vs KV cache, finer version: 150 EASY calculations (2 digits x 1 digit + 2 digits), same questions for the 3 caches.
# Why: kv-quality (12 hard calculations, 3 correct out of 12) could not show a loss. Here the model must get almost
# everything right; a drop for `q4_0` or `q8_0` becomes visible. Temperature 0: the 2 repetitions give almost identical
# answers (a random identifier at the start of the prompt can change 1 or 2 answers); the useful information is the rate
# over 150 questions. Careful: each question only fills ≈ 65 tokens of KV cache, so the test puts little load on quantisation.
name: kv-quality-easy
repetitions: 2
warmup: 1
design: blocked
cooldown: {target_c: 60, max_wait_s: 300}
request: {num_ctx: 8192, gen_tokens: 16, think: false}
workload: arith_easy
baseline: {kv_cache_type: f16}
factors:
  kv_cache_type: [f16, q8_0, q4_0]
