# Context window size (num_ctx) × KV cache type: VRAM, speed and limit before spilling over to the CPU.
# Question: how much does it cost to RESERVE a large window, even when it is not filled? (the prompt stays short: 1,024 tokens)
# Complements `context-scaling` (which varies the amount of text inside a fixed 65,536 window).
# To read: `peak_mem_used_mb` (VRAM of the whole card: nothing else may use it) and `gpu_frac` (must stay at 100 %).
# The 98,304 point is there to find the limit: it may spill over to the CPU (gpu_frac < 100 %) or be capped at the model's
# maximum (see `ctx_effective` in runs.csv). A spill-over is a RESULT, not an error.
name: ctx-window
repetitions: 4
warmup: 1
design: blocked        # conditions grouped by window size: the model is only reloaded when num_ctx changes
cooldown: {target_c: 60, max_wait_s: 600}
request: {ctx_depth: 1024, gen_tokens: 128}
workload: mixed
baseline: {num_ctx: 8192, kv_cache_type: f16}
factors:
  num_ctx: [8192, 16384, 32768, 65536, 98304]
  kv_cache_type: [f16, q8_0]
