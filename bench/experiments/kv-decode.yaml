# DECODING speed per KV cache type, with a deep context (~24,000 characters filled).
# Why: in kv-cache, the model only answered with 4 to 7 tokens (a 6-character code), so the decoding speed is
# invalid there. Here the "mixed" workload asks for a long text: up to 128 generated tokens.
# Also measures VRAM (peak_mem_used_mb column of runs.csv). No accuracy test: see kv-quality.
name: kv-decode
repetitions: 6
warmup: 1
design: blocked
cooldown: {target_c: 60, max_wait_s: 600}
request: {num_ctx: 32768, ctx_depth: 24000, gen_tokens: 128}
workload: mixed
baseline: {kv_cache_type: f16}
factors:
  kv_cache_type: [f16, q8_0, q4_0]
