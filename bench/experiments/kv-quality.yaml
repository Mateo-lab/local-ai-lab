# Quality vs KV cache: 12 (arithmetic) calculations per measurement. Detects a degradation due to quantisation
name: kv-quality
repetitions: 10
warmup: 1
cooldown: {target_c: 65, max_wait_s: 300}
request: {num_ctx: 8192, gen_tokens: 64, think: false}
workload: arith
baseline: {kv_cache_type: f16}
factors:
  kv_cache_type: [f16, q8_0, q4_0]
