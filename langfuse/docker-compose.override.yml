# Override of Langfuse's OFFICIAL docker-compose.yml (cloned by ../6-langfuse.sh into ./app).
# It fixes three things of the official file:
#  1. the interface (port 3000) and MinIO (9090) are published there on ALL network interfaces;
#     here they are bound to 127.0.0.1;
#  2. ports 3000 (Open WebUI) and 9090 (Prometheus) are already taken in this lab;
#  3. Langfuse joins the obs-net network, shared with Open WebUI and Hermes only.
# "!override" replaces the list of ports instead of adding to it (Docker Compose >= 2.24).

services:
  langfuse-web:
    ports: !override
      - "127.0.0.1:3002:3000"
    networks:
      - default
      - obs-net
    environment:
      # Otherwise Next.js only listens on the container's first address ("default" network): the portal and
      # the agents, which go through obs-net, got "Connection refused". The published port stays on 127.0.0.1.
      HOSTNAME: "0.0.0.0"
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  minio:
    ports: !override
      - "127.0.0.1:9092:9000"
      - "127.0.0.1:9091:9001"
    logging: *logs

  langfuse-worker:
    logging: *logs
  clickhouse:
    logging: *logs
  redis:
    logging: *logs
  postgres:
    logging: *logs

networks:
  obs-net:
    external: true
    name: obs-net
