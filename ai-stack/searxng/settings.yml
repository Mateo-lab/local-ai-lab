# SearXNG settings for Open WebUI.
# Start from the default settings and only change what is needed.
# The secret key comes from the SEARXNG_SECRET variable (.env file).
use_default_settings: true

general:
  instance_name: "AI Lab"

search:
  # "json" is REQUIRED: without it, Open WebUI gets a 403 error.
  formats:
    - html
    - json
  safe_search: 0
  # Language of the results: "auto", or a code such as "en-US", "fr-BE", "de-DE".
  default_lang: "auto"

server:
  # No limiter: the service is only reachable by Open WebUI (internal network).
  limiter: false
  image_proxy: false
