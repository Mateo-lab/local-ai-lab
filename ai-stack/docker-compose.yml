# Local AI stack: Ollama + Open WebUI + n8n + Qdrant + SearXNG (web search) + Kokoro (voice) + Tika (document extraction)
# Target: Ubuntu + Docker Engine + NVIDIA Container Toolkit, RTX 3090 (24 GB)
#
# Every port is bound to 127.0.0.1: nothing is exposed on the local network.
# Remote access: SSH tunnel (lab client) or Tailscale, never an open port.

name: ai-stack

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      # Saves VRAM: flash attention + quantised KV cache
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
      # Default context window (OpenClaw recommends >= 64k, see README)
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-32768}
      # Keeps the model in VRAM between two requests (avoids reloads)
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      # 1 = a single model in VRAM. Set 2 to also keep a small "task model" there
      # (conversation titles, etc.) without unloading the big model: see docs/open-webui.md
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - ai-net
      - llm-net # network shared with the OpenClaw container (see ../openclaw)
      - hermes-net # network shared with Hermes (see ../hermes): it only sees Ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      # The first account created becomes admin; set to "false" afterwards
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-true}
      # Comfort (values read at the 1st start only; afterwards: Admin > Settings). See docs/open-webui.md
      DEFAULT_LOCALE: ${OPEN_WEBUI_LOCALE:-en}
      # Small model for titles/tags: leave empty until you have one (see `lab task-model`)
      TASK_MODEL: ${OWUI_TASK_MODEL:-}
      # Web search through SearXNG (values read at the 1st start; afterwards: Admin > Settings > Web Search)
      ENABLE_WEB_SEARCH: "true"
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search
      # Read aloud through Kokoro (see the kokoro service)
      AUDIO_TTS_ENGINE: openai
      AUDIO_TTS_OPENAI_API_BASE_URL: http://kokoro:8880/v1
      AUDIO_TTS_OPENAI_API_KEY: not-needed
      AUDIO_TTS_MODEL: kokoro
      AUDIO_TTS_VOICE: ${KOKORO_VOICE:-af_bella}
      # Document extraction (PDF, Office...) through Tika
      CONTENT_EXTRACTION_ENGINE: tika
      TIKA_SERVER_URL: http://tika:9998
    depends_on:
      ollama:
        condition: service_healthy
      searxng:
        condition: service_started
      kokoro:
        condition: service_started
      tika:
        condition: service_started
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "127.0.0.1:3000:8080"
    networks:
      - ai-net
      - obs-net # reaches Langfuse (conversation tracing), see ../langfuse

  # Private web search engine. No published port: only Open WebUI reaches it (ai-net).
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env (run ./2-secrets.sh again)}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    networks:
      - ai-net

  # Text-to-speech (TTS). CPU version: uses no VRAM, so it does not get in the model's way.
  # For the GPU: image ghcr.io/remsky/kokoro-fastapi-gpu + GPU reservation (like ollama).
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: kokoro
    restart: unless-stopped
    networks:
      - ai-net

  # Text extraction from documents for RAG. No published port.
  tika:
    image: apache/tika:latest-full
    container_name: tika
    restart: unless-stopped
    networks:
      - ai-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    networks:
      - ai-net

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-Europe/Brussels}
      TZ: ${N8N_TIMEZONE:-Europe/Brussels}
      # Key that encrypts the stored credentials: back it up with the volume
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Needed if you reach n8n over http through Tailscale/IP (not localhost)
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      # Dedicated PostgreSQL database (instead of SQLite): more robust execution history
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres-n8n
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_N8N_PASSWORD:?Set POSTGRES_N8N_PASSWORD in .env}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres-n8n:
        condition: service_healthy
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - ai-net

  # n8n's database. No published port: only reachable from ai-net.
  # Do not share it with Langfuse (which ships its own database).
  postgres-n8n:
    image: postgres:16-alpine
    container_name: postgres-n8n
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_N8N_PASSWORD:?Set POSTGRES_N8N_PASSWORD in .env}
    volumes:
      - postgres_n8n_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-net

volumes:
  ollama_data:
  open_webui_data:
  qdrant_data:
  n8n_data:
  postgres_n8n_data:

networks:
  ai-net:
  # The next three networks are "internal": Docker gives them no exit (neither Internet nor local network).
  # The agents connected to them only reach containers on the same network. Ollama and Open WebUI go out through ai-net.
  # See docs/agent-isolation.md.
  # Fixed name so that the OpenClaw project can join it
  llm-net:
    name: llm-net
    internal: true
  # Same for Hermes: a network separate from OpenClaw's, they do not see each other
  hermes-net:
    name: hermes-net
    internal: true
  # Observability network: Open WebUI and Hermes reach Langfuse there, and nothing else
  obs-net:
    name: obs-net
    internal: true
