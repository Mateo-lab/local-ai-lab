<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiBeast panel</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>AiBeast panel</h1>
  <p id="statut" role="status">Loading…</p>
</header>
<main>
  <section aria-labelledby="t-modes">
    <h2 id="t-modes">Modes</h2>
    <div class="boutons">
      <button data-action="mode-images">Images mode<small>unloads the model, starts ComfyUI</small></button>
      <button data-action="mode-normal">Normal mode<small>stops ComfyUI, restores everything</small></button>
      <button data-action="mode-agents">Agents mode<small>frees VRAM for Hermes</small></button>
    </div>
  </section>
  <section aria-labelledby="t-controle">
    <h2 id="t-controle">Checks</h2>
    <div class="boutons">
      <button data-action="etat">State<small>mode, VRAM, loaded models</small></button>
      <button data-action="doctor">Health<small>full check</small></button>
    </div>
  </section>
  <section aria-labelledby="t-maint">
    <h2 id="t-maint">Maintenance</h2>
    <div class="boutons">
      <button data-action="update">Update<small>backup then Docker images</small></button>
      <button data-action="backup">Backup<small>encrypted, on this disk</small></button>
    </div>
  </section>
  <section aria-labelledby="t-hermes">
    <h2 id="t-hermes">Hermes: work to review</h2>
    <div id="hermes" class="liste"><p>Loading…</p></div>
    <p class="note">To open Hermes in a project, use the terminal (<code>lab dev start NAME</code>) or <code>AiBeast-Hermes.bat</code>.</p>
  </section>
  <section aria-labelledby="t-sortie">
    <h2 id="t-sortie">Result <span id="job"></span></h2>
    <pre id="sortie" tabindex="0" aria-live="polite">No action started.</pre>
  </section>
</main>
<script src="/app.js"></script>
</body>
</html>
