- Agents (à la demande):
    - OpenClaw:
        icon: mdi-robot-outline
        href: http://127.0.0.1:18789
        description: "Optionnel : agent isolé (installer avec openclaw/install.sh). Pas de voyant"
    - Hermes:
        icon: mdi-console
        description: "Optionnel : agent en ligne de commande, lancé avec ./5-hermes.sh (pas d'interface web)"

# Mesures lues dans Prometheus (nécessite le monitoring démarré). Chaque carte = une requête.
- Machine:
    - GPU puissance:
        icon: mdi-flash
        description: RTX 3090
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=nvidia_smi_power_draw_watts
          refreshInterval: 5000
          mappings:
            - field: data.result.0.value.1
              label: Puissance
              format: float
              suffix: " W"
    - GPU température:
        icon: mdi-thermometer
        description: RTX 3090
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=nvidia_smi_temperature_gpu
          refreshInterval: 5000
          mappings:
            - field: data.result.0.value.1
              label: Température
              format: float
              suffix: " °C"
    - GPU charge:
        icon: mdi-chip
        description: Utilisation du GPU
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=round%28nvidia_smi_utilization_gpu_ratio%2A100%2C0.1%29
          refreshInterval: 5000
          mappings:
            - field: data.result.0.value.1
              label: Charge
              format: float
              suffix: " %"
    - GPU état:
        icon: mdi-sleep
        description: P8 = repos, P2 = calcul actif, P0 = pleine charge
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=nvidia_smi_pstate
          refreshInterval: 5000
          mappings:
            - field: data.result.0.value.1
              label: État
              prefix: "P"
    - VRAM:
        icon: mdi-memory
        description: Mémoire du GPU utilisée
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=nvidia_smi_memory_used_bytes
          refreshInterval: 10000
          mappings:
            - field: data.result.0.value.1
              label: Utilisée
              format: bytes
    - RAM:
        icon: mdi-memory
        description: Mémoire de la machine utilisée
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=round%28%281-node_memory_MemAvailable_bytes%2Fnode_memory_MemTotal_bytes%29%2A100%2C0.1%29
          refreshInterval: 10000
          mappings:
            - field: data.result.0.value.1
              label: Utilisée
              format: float
              suffix: " %"
    - Disque système:
        icon: mdi-harddisk
        description: Disque système (/)
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=round%28100-node_filesystem_avail_bytes%7Bmountpoint%3D%22%2F%22%7D%2Fnode_filesystem_size_bytes%7Bmountpoint%3D%22%2F%22%7D%2A100%2C0.1%29
          refreshInterval: 60000
          mappings:
            - field: data.result.0.value.1
              label: Plein à
              format: float
              suffix: " %"
    - Disque données:
        icon: mdi-harddisk
        description: Disque de données le plus rempli (ext4/xfs/btrfs hors /)
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=round%28max%28100-node_filesystem_avail_bytes%7Bfstype%3D~%22ext4%7Cxfs%7Cbtrfs%22%2Cmountpoint%21%3D%22%2F%22%7D%2Fnode_filesystem_size_bytes%7Bfstype%3D~%22ext4%7Cxfs%7Cbtrfs%22%2Cmountpoint%21%3D%22%2F%22%7D%2A100%29%2C0.1%29
          refreshInterval: 60000
          mappings:
            - field: data.result.0.value.1
              label: Plein à
              format: float
              suffix: " %"
