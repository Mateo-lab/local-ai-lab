# Agents started on demand. No light: see docs/portal.md (network isolation of OpenClaw and Hermes).
- Agents (on demand):
    - OpenClaw:
        icon: mdi-robot-outline
        href: http://127.0.0.1:18789
        description: "Optional: isolated agent (install with openclaw/install.sh). No light"
    - Hermes:
        icon: mdi-console
        description: "Optional: command-line agent, started with ./5-hermes.sh (no web interface)"

# Metrics read from Prometheus (needs monitoring running). Each card = one query.
- Machine:
    - GPU power:
        icon: mdi-flash
        description: NVIDIA GPU
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=nvidia_smi_power_draw_watts
          refreshInterval: 5000
          mappings:
            - field: data.result.0.value.1
              label: Power
              format: float
              suffix: " W"
    - GPU temperature:
        icon: mdi-thermometer
        description: NVIDIA GPU
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=nvidia_smi_temperature_gpu
          refreshInterval: 5000
          mappings:
            - field: data.result.0.value.1
              label: Temperature
              format: float
              suffix: " °C"
    - GPU load:
        icon: mdi-chip
        description: GPU utilisation
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=round%28nvidia_smi_utilization_gpu_ratio%2A100%2C0.1%29
          refreshInterval: 5000
          mappings:
            - field: data.result.0.value.1
              label: Load
              format: float
              suffix: " %"
    - GPU state:
        icon: mdi-sleep
        description: P8 = idle, P2 = active compute, P0 = full load
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=nvidia_smi_pstate
          refreshInterval: 5000
          mappings:
            - field: data.result.0.value.1
              label: State
              prefix: "P"
    - VRAM:
        icon: mdi-memory
        description: GPU memory used
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=nvidia_smi_memory_used_bytes
          refreshInterval: 10000
          mappings:
            - field: data.result.0.value.1
              label: Used
              format: bytes
    - RAM:
        icon: mdi-memory
        description: Machine memory used
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=round%28%281-node_memory_MemAvailable_bytes%2Fnode_memory_MemTotal_bytes%29%2A100%2C0.1%29
          refreshInterval: 10000
          mappings:
            - field: data.result.0.value.1
              label: Used
              format: float
              suffix: " %"
    - System disk:
        icon: mdi-harddisk
        description: System disk (/)
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=round%28100-node_filesystem_avail_bytes%7Bmountpoint%3D%22%2F%22%7D%2Fnode_filesystem_size_bytes%7Bmountpoint%3D%22%2F%22%7D%2A100%2C0.1%29
          refreshInterval: 60000
          mappings:
            - field: data.result.0.value.1
              label: Full
              format: float
              suffix: " %"
    - Data disk:
        icon: mdi-harddisk
        description: Fullest data disk (ext4/xfs/btrfs except /)
        widget:
          type: customapi
          url: http://prometheus:9090/api/v1/query?query=round%28max%28100-node_filesystem_avail_bytes%7Bfstype%3D~%22ext4%7Cxfs%7Cbtrfs%22%2Cmountpoint%21%3D%22%2F%22%7D%2Fnode_filesystem_size_bytes%7Bfstype%3D~%22ext4%7Cxfs%7Cbtrfs%22%2Cmountpoint%21%3D%22%2F%22%7D%2A100%29%2C0.1%29
          refreshInterval: 60000
          mappings:
            - field: data.result.0.value.1
              label: Full
              format: float
              suffix: " %"
