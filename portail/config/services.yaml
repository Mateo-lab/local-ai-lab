# One light (siteMonitor) per service: HTTP request from the container, through the shared networks.
# "href" = address to open in the machine's browser (or your PC's if the SSH tunnel is up).

- Interfaces:
    - Button panel:
        icon: mdi-gesture-tap-button
        href: http://127.0.0.1:3011
        description: Modes, update, backup, Hermes review (lab panel install)
    - Open WebUI:
        icon: open-webui.png
        href: http://127.0.0.1:3000
        description: Chat with the models, documents, web search, voice
        siteMonitor: http://open-webui:8080
    - n8n:
        icon: n8n.png
        href: http://127.0.0.1:5678
        description: Automations
        siteMonitor: http://n8n:5678/healthz
    - ComfyUI:
        icon: comfyui.png
        href: http://127.0.0.1:8188
        description: Images (start with lab mode images)
        siteMonitor: http://comfyui:8188
    - Qdrant:
        icon: qdrant.png
        href: http://127.0.0.1:6333/dashboard
        description: Vector database
        siteMonitor: http://qdrant:6333/healthz

- Engine and tools:
    - Ollama:
        icon: ollama.png
        href: http://127.0.0.1:11434
        description: Model engine (API)
        siteMonitor: http://ollama:11434
    - SearXNG:
        icon: searxng.png
        description: Private web search (internal)
