# Un voyant (siteMonitor) par service : requête HTTP depuis le conteneur, via les réseaux partagés.
# "href" = adresse à ouvrir dans le navigateur de la machine (ou de ton PC si le tunnel SSH est actif).

- Interfaces:
    - Panneau de boutons:
        icon: mdi-gesture-tap-button
        href: http://127.0.0.1:3011
        description: Modes, mise à jour, sauvegarde, revue Hermes (lab panel install)
    - Open WebUI:
        icon: open-webui.png
        href: http://127.0.0.1:3000
        description: Chat avec les modèles, documents, recherche web, voix
        siteMonitor: http://open-webui:8080
    - n8n:
        icon: n8n.png
        href: http://127.0.0.1:5678
        description: Automatisations
        siteMonitor: http://n8n:5678/healthz
    - ComfyUI:
        icon: comfyui.png
