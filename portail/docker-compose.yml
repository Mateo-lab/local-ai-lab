# Portal ("portail"): home page (Homepage) with a health light per service and the machine's metrics.
# Interface: http://127.0.0.1:3010  (bound to 127.0.0.1: only visible from the machine, or through the SSH tunnel)
#
# Prerequisite: ai-stack AND monitoring started (they create the networks below). `lab start` takes care of it.
# The portal has NO access to the Docker socket (so no root rights on the machine): the state of each service
# is checked by an HTTP request (siteMonitor) on the shared networks.

name: portail

services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      # Required (Homepage refuses other host names). The port must be the one used in the browser.
      HOMEPAGE_ALLOWED_HOSTS: "127.0.0.1:3010,localhost:3010"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: Europe/Brussels
    volumes:
      - ./config:/app/config
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      - ai-net    # Open WebUI, n8n, Qdrant, Ollama, SearXNG, Kokoro, Tika, ComfyUI
      - mon-net   # Prometheus, Grafana
      - obs-net   # Langfuse
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  ai-net:
    external: true
    name: ai-stack_ai-net
  mon-net:
    external: true
    name: mon-net
  obs-net:
    external: true
    name: obs-net
