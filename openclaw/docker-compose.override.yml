# Override copied to the root of the OpenClaw repository by install.sh.
#
# The official compose (in the openclaw/openclaw repository) defines the services
# `openclaw-gateway` and `openclaw-cli`. `openclaw-cli` shares the gateway's
# network namespace, so only the gateway needs to be attached to a network.
#
# The gateway joins `llm-net` (created by ../ai-stack) to reach Ollama at
# http://ollama:11434. It does NOT join `ai-net`: so it has no direct access
# to n8n, Qdrant or Open WebUI. llm-net is internal: no Internet (docs/agent-isolation.md).

services:
  openclaw-gateway:
    networks:
      - default
      - llm-net

networks:
  llm-net:
    external: true
    name: llm-net
