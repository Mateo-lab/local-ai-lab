# Override copié à la racine du dépôt OpenClaw par install.sh.
#
# Le compose officiel (dans le dépôt openclaw/openclaw) définit les services
# `openclaw-gateway` et `openclaw-cli`. `openclaw-cli` partage l'espace réseau
# de la gateway, donc seule la gateway a besoin d'être rattachée à un réseau.
#
# La gateway rejoint `llm-net` (créé par ../ai-stack) pour joindre Ollama via
# http://ollama:11434. Elle ne rejoint PAS `ai-net` : elle n'a donc aucun accès
# direct à n8n, Qdrant ni Open WebUI.

services:
  openclaw-gateway:
    networks:
      - default
      - llm-net

networks:
  llm-net:
    external: true
    name: llm-net
