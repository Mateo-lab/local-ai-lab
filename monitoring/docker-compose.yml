# Monitoring: Prometheus + Grafana + node-exporter + GPU exporter (nvidia-smi)
# Every port is bound to 127.0.0.1. Grafana: http://127.0.0.1:3001
# (3000 is already taken by Open WebUI in ../ai-stack).

name: monitoring

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    # Only useful for the OpenClaw job (commented out in prometheus.yml)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - mon-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - mon-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    # No published port: only Prometheus queries it, through mon-net.
    # Limit: in bridge networking, the network statistics are the container's,
    # not the machine's (CPU, RAM and disk are correct).
    networks:
      - mon-net

  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:latest
    container_name: gpu-exporter
    restart: unless-stopped
    environment:
      NVIDIA_DRIVER_CAPABILITIES: utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    networks:
      - mon-net

volumes:
  prometheus_data:
  grafana_data:

networks:
  # Fixed name: portail/ and alerting/ join this network as the external network "mon-net"
  mon-net:
    name: mon-net
