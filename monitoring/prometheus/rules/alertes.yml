# Règles d'alerte. Chaque règle : expression PromQL, durée « for » (le problème doit durer), gravité, message.
# Les noms de métriques du GPU viennent de utkuozdemir/nvidia_gpu_exporter (nvidia_smi_*) ; ceux de la machine de node-exporter.
groups:
  - name: services
    rules:
      - alert: ServiceInjoignable
        expr: probe_success{job="sondes"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} ne répond plus"
          description: "La sonde HTTP échoue depuis 3 minutes. Voir `lab status` et `lab logs`."

      - alert: ExporterInjoignable
        expr: up{job=~"node|gpu"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Collecte arrêtée : {{ $labels.job }}"
          description: "Prometheus ne reçoit plus les mesures de {{ $labels.job }}."

  - name: machine
    rules:
      - alert: DisqueDataPresquePlein
        expr: (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs",mountpoint!="/"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs",mountpoint!="/"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.mountpoint }} rempli à plus de 85 %"
          description: "Modèles, images Docker et sauvegardes vivent ici. Voir `lab doctor` et `docker system df`."

      - alert: DisqueSystemePresquePlein
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disque système (/) rempli à plus de 85 %"
          description: "Le disque système est petit (480 Go) : nettoie les journaux et les paquets."

      - alert: MemoireVive
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.92
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "RAM utilisée à plus de 92 %"
          description: "Risque de blocage ou de processus tué."

  - name: gpu
    rules:
      - alert: GpuTropChaud
        expr: nvidia_smi_temperature_gpu > 85
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "GPU à {{ $value }} °C"
          description: "Au-delà de 85 °C depuis 5 minutes. Vérifie le refroidissement ; `lab gpu-limit install 300` réduit la chaleur."

      # Cas vécu le 15 octobre : le bureau à distance gardait le GPU en P2 (≈ 124 W) sans aucune charge.
      - alert: GpuBloqueEnP2AuRepos
        expr: nvidia_smi_pstate < 8 and nvidia_smi_utilization_gpu_ratio < 0.05
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "GPU inactif mais pas en veille (P{{ $value }})"
          description: "Utilisation < 5 % depuis 30 min sans retomber en P8 : ≈ 100 W gaspillés. Probable : bureau à distance actif (`lab bureau off`) ou un processus qui garde un contexte CUDA ouvert."
