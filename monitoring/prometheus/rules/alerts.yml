# Alert rules. Each rule: PromQL expression, "for" duration (the problem must last), severity, message.
# The GPU metric names come from utkuozdemir/nvidia_gpu_exporter (nvidia_smi_*); the machine's from node-exporter.
groups:
  - name: services
    rules:
      - alert: ServiceUnreachable
        expr: probe_success{job="probes"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.instance }} is not answering"
          description: "The HTTP probe has been failing for 3 minutes. See `lab status` and `lab logs`."

      - alert: ExporterUnreachable
        expr: up{job=~"node|gpu"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Collection stopped: {{ $labels.job }}"
          description: "Prometheus no longer receives the measurements of {{ $labels.job }}."

  - name: machine
    rules:
      - alert: DataDiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs",mountpoint!="/"} / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs",mountpoint!="/"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.mountpoint }} more than 85 % full"
          description: "Models, Docker images and backups live here. See `lab doctor` and `docker system df`."

      - alert: SystemDiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "System disk (/) more than 85 % full"
          description: "Clean up logs and packages (sudo journalctl --vacuum-size=200M, sudo apt clean)."

      - alert: RamAlmostFull
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.92
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than 92 % of RAM used"
          description: "Risk of a freeze or of a killed process."

  - name: gpu
    rules:
      - alert: GpuTooHot
        expr: nvidia_smi_temperature_gpu > 85
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "GPU at {{ $value }} °C"
          description: "Above 85 °C for 5 minutes. Check the cooling; `lab gpu-limit install 300` reduces heat."

      # Seen on the reference machine: the remote desktop kept the GPU in P2 (≈ 124 W) without any load.
      - alert: GpuStuckInP2AtIdle
        expr: nvidia_smi_pstate < 8 and nvidia_smi_utilization_gpu_ratio < 0.05
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "GPU idle but not asleep (P{{ $value }})"
          description: "Utilisation < 5 % for 30 min without going back to P8: ≈ 100 W wasted. Likely: remote desktop active (`lab desktop off`) or a process keeping a CUDA context open."
