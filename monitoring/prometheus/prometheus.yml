global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (see docs/alerts.md) and alert receiver (../alerting project)
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # The machine's CPU, RAM, disk
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # NVIDIA GPU (through nvidia-smi)
  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9835"]

  # "Is the service answering?" probes through blackbox-exporter (../alerting project).
  # If alerting is not started, these probes are simply "down" on the exporter side (no effect on the rest).
  - job_name: probes
    metrics_path: /probe
    params:
      module: [http_up]
    static_configs:
      - targets:
          - http://open-webui:8080
          - http://n8n:5678/healthz
          - http://qdrant:6333/healthz
          - http://ollama:11434
          - http://searxng:8080
          - http://kokoro:8880/docs
          - http://tika:9998/tika
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # --- OpenClaw (optional, disabled by default; not tested) ---
  # Prerequisite (according to the OpenClaw docs): install and enable the
  # `diagnostics-prometheus` plugin in the gateway. The metrics route is protected
  # by the gateway's authentication: Prometheus must present the token.
  # Never publish /metrics without authentication.
  #
  # 1. Put the token (OPENCLAW_GATEWAY_TOKEN from ~/openclaw/.env) in
  #    ./prometheus/openclaw_token (no trailing newline) and mount that file
  #    in the prometheus container (volumes: ./prometheus/openclaw_token:/etc/prometheus/openclaw_token:ro).
  # 2. Uncomment the job below then: docker compose restart prometheus
  #
  # - job_name: openclaw
  #   metrics_path: /api/diagnostics/prometheus
  #   authorization:
  #     type: Bearer
  #     credentials_file: /etc/prometheus/openclaw_token
  #   static_configs:
  #     - targets: ["host.docker.internal:18789"]
