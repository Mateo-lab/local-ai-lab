global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Règles d'alerte (voir docs/alerts.md) et destinataire des alertes (projet ../alerting)
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # CPU, RAM, disque de la machine
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # RTX 3090 (via nvidia-smi)
  - job_name: gpu
    static_configs:
      - targets: ["gpu-exporter:9835"]

  # Sondes « le service répond-il ? » via blackbox-exporter (projet ../alerting).
  # Si alerting n'est pas démarré, ces sondes sont simplement « down » côté exporter (pas d'effet sur le reste).
  - job_name: sondes
    metrics_path: /probe
    params:
      module: [http_up]
    static_configs:
      - targets:
          - http://open-webui:8080
          - http://n8n:5678/healthz
          - http://qdrant:6333/healthz
          - http://ollama:11434
          - http://searxng:8080
          - http://kokoro:8880/docs
          - http://tika:9998/tika
          - http://grafana:3000/api/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # --- OpenClaw (optionnel, désactivé par défaut) ---
  # Prérequis (d'après la doc OpenClaw) : installer et activer le plugin
  # `diagnostics-prometheus` dans la gateway. La route de métriques est protégée
  # par l'authentification de la gateway : Prometheus doit présenter le jeton.
  # Ne publie jamais de /metrics sans authentification.
  #
  # 1. Mets le jeton (OPENCLAW_GATEWAY_TOKEN de ~/openclaw/.env) dans
  #    ./prometheus/openclaw_token (sans retour à la ligne) et monte ce fichier
  #    dans le conteneur prometheus (volumes: ./prometheus/openclaw_token:/etc/prometheus/openclaw_token:ro).
  # 2. Décommente le job ci-dessous puis : docker compose restart prometheus
  #
  # - job_name: openclaw
  #   metrics_path: /api/diagnostics/prometheus
  #   authorization:
  #     type: Bearer
  #     credentials_file: /etc/prometheus/openclaw_token
  #   static_configs:
  #     - targets: ["host.docker.internal:18789"]
