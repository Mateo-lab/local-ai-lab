# ComfyUI : génération d'images, pilotée par Open WebUI.
# Image COMMUNAUTAIRE (pas d'image officielle) : github.com/clsferguson/ComfyUI-Docker (licence MIT).
# Elle suit les versions de ComfyUI mais reste un projet personnel : fige un tag (vX.Y.Z) une fois que ça marche.
#
# Joint le réseau de la stack (ai-stack_ai-net) pour qu'Open WebUI l'atteigne sur http://comfyui:8188.
# Le port est lié à 127.0.0.1 : interface visible uniquement depuis la machine.

name: comfyui

services:
  comfyui:
    image: ghcr.io/clsferguson/comfyui-docker@sha256:6c0adbc07478eca67c56ec25ac0bfdd4e58ea91fc7f63b0cad45a11a2ad76a32   # version du 6 oct. 2026, figée (voir docs/image-generation.md)
    container_name: comfyui
    # Ne démarre pas tout seul au boot : tu le lances quand tu en as besoin (il prend de la VRAM).
    restart: "no"
    environment:
      TZ: Europe/Brussels
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TRITON_CACHE_DIR: /tmp/triton   # ComfyUI tourne en appuser avec HOME=/root (runuser -p) : /root/.triton non inscriptible
      TRITON_HOME: /tmp/triton
      COMFY_FORCE_INSTALL: "1"     # réinstalle à chaque démarrage les requirements des nœuds (gguf pour ComfyUI-GGUF)
    volumes:
      - comfyui_user:/app/ComfyUI/user/default
      - comfyui_nodes:/app/ComfyUI/custom_nodes
      - ./data/models:/app/ComfyUI/models
      - ./data/input:/app/ComfyUI/input
      - ./data/output:/app/ComfyUI/output
    ports:
      - "127.0.0.1:8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai-net

volumes:
  comfyui_user:
  comfyui_nodes:

networks:
  ai-net:
    external: true
    name: ai-stack_ai-net
