# ComfyUI: image generation, driven by Open WebUI.
# COMMUNITY image (no official image): github.com/clsferguson/ComfyUI-Docker (MIT license).
# It follows ComfyUI's versions but remains a personal project: it is pinned by digest below.
#
# Joins the stack's network (ai-stack_ai-net) so that Open WebUI reaches it at http://comfyui:8188.
# The port is bound to 127.0.0.1: interface only visible from the machine.

name: comfyui

services:
  comfyui:
    image: ghcr.io/clsferguson/comfyui-docker@sha256:6c0adbc07478eca67c56ec25ac0bfdd4e58ea91fc7f63b0cad45a11a2ad76a32   # pinned version (see docs/image-generation.md)
    container_name: comfyui
    # Does not start by itself at boot: start it when you need it (it takes VRAM).
    restart: "no"
    environment:
      TZ: Europe/Brussels
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TRITON_CACHE_DIR: /tmp/triton   # ComfyUI runs as appuser with HOME=/root (runuser -p): /root/.triton is not writable
      TRITON_HOME: /tmp/triton
      COMFY_FORCE_INSTALL: "1"     # reinstalls the nodes' requirements at every start (gguf for ComfyUI-GGUF)
    volumes:
      - comfyui_user:/app/ComfyUI/user/default
      - comfyui_nodes:/app/ComfyUI/custom_nodes
      - ./data/models:/app/ComfyUI/models
      - ./data/input:/app/ComfyUI/input
      - ./data/output:/app/ComfyUI/output
    ports:
      - "127.0.0.1:8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ai-net

volumes:
  comfyui_user:
  comfyui_nodes:

networks:
  ai-net:
    external: true
    name: ai-stack_ai-net
